# MIRVA on Cloudflare: one Worker that serves the pages in public/ and runs the app in worker/.
# Free plan is enough to start. The two ids below are filled in by `npm run cloud:setup`.
name = "mirva"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "mirva"
database_id = "9ead634b-e67f-4d82-a1a3-532637566e74"

[[kv_namespaces]]
binding = "FILES"
id = "cea946a8d25c41838908163c7823c702"

[triggers]
crons = ["17 */6 * * *"]

[observability]
enabled = true

# Settings, not secrets. The Decart key and the setup key are secrets: `npx wrangler secret put NAME`.
[vars]
MIRVA_SESSION_SECONDS = "120"
MIRVA_IDLE_SECONDS = "60"
MIRVA_SHOTS_PER_HOUR = "30"
MIRVA_SESSIONS_PER_HOUR = "20"
# The most the try-on engine may cost in one day, in US dollars, before MIRVA says it is resting (live video, then
# portraits). Kept low while there is no money to spend (15 Oct 2026): $2 is about 36 portraits. The founder and store
# users are never held.
MIRVA_DAILY_USD = "1"
MIRVA_DAILY_PORTRAIT_USD = "2"
# Free first portraits a day, for people who have not joined yet (one each, on their own browser). 0 turns it off.
MIRVA_GUEST_SHOTS = "15"
# Features tried on named accounts before anyone else: "<feature>:<user id>,<user id>; <feature>:...". "three" makes
# all three looks at once; "mirror" opens the real-mirror version at /mirror?glass=real (both for the founder's habab
# account only, 17 Oct 2026). "three" was switched off on 22 Oct: three portraits at once queue at the engine and the
# first one came back later.
MIRVA_TRIALS = "mirror:ofFemkEZc4e09IDa; outfit:ofFemkEZc4e09IDa"
MIRVA_PAYMENTS = "off"
